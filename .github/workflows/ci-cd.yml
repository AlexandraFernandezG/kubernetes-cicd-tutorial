name: CI/CD Pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build-and-push:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}

      - name: Set lowercase repo name
        run: |
          $repo = "${{ github.repository }}".ToLower()
          echo "IMAGE_REPO=$repo" >> $env:GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_REPO }}:latest
            ghcr.io/${{ env.IMAGE_REPO }}:${{ github.sha }}

      - name: Update GitOps repository
        shell: powershell
        env:
          GIT_TOKEN: ${{ secrets.GITOPS_PAT }}
        run: |
          git config --global credential.helper store
          "https://$env:GIT_TOKEN:x-oauth-basic@github.com" | Out-File -Encoding ascii ~/.git-credentials

          Remove-Item -Recurse -Force gitops -ErrorAction SilentlyContinue

          $owner = "${{ github.repository_owner }}".ToLower()

          git clone https://github.com/$owner/grade-api-gitops.git gitops
          Set-Location gitops

          (Get-Content deployment.yaml) -replace 'image: ghcr\.io/.*', "image: ghcr.io/$env:IMAGE_REPO`:${{ github.sha }}" | Set-Content deployment.yaml

          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add deployment.yaml
          git commit -m "Update image to ${{ github.sha }}"
          git push -f https://$env:GIT_TOKEN@github.com/$owner/grade-api-gitops.git main
          
          cat deployment.yaml
          
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add deployment.yaml
          git commit -m "Update image to ${{ github.sha }}"

          git push -f https://${GIT_TOKEN}@github.com/$owner/grade-api-gitops.git main
